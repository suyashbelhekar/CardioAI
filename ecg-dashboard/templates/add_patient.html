{% extends "base.html" %}
{% block title %}Add Patient — CardioAI{% endblock %}
{% block page_title %}Add New Patient{% endblock %}
{% block page_sub %}Register a new patient record{% endblock %}

{% block content %}
<div class="card" style="max-width:760px;">
  <div class="card-title"><i class="fas fa-user-plus" style="color:#3b82f6;"></i> Patient Details</div>
  <div class="card-sub">Fields marked * are required</div>

  <form method="POST" style="margin-top:24px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Full Name *</label>
        <input type="text" name="full_name" required placeholder="John Doe"
               style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Mobile Number *</label>
        <input type="tel" name="mobile_no" required placeholder="+1 555 000 0000"
               style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Date of Birth</label>
        <input type="date" name="dob"
               style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Gender</label>
        <select name="gender"
                style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
          <option value="">Select…</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Email</label>
        <input type="email" name="email" placeholder="patient@email.com"
               style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Primary Disease / Condition</label>
        <input type="text" name="disease" placeholder="e.g. Atrial Fibrillation"
               style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;">
      </div>

    </div>

    <div style="margin-top:20px;">
      <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Address</label>
      <textarea name="address" rows="2" placeholder="123 Main St, City, State, ZIP"
                style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;resize:vertical;"></textarea>
    </div>

    <div style="margin-top:20px;">
      <label style="display:block;font-size:.88rem;font-weight:600;color:#475569;margin-bottom:7px;">Medical History</label>
      <textarea name="medical_history" rows="3" placeholder="Previous conditions, surgeries, medications, allergies…"
                style="width:100%;padding:11px 13px;border:2px solid #e2e8f0;border-radius:8px;font-size:.9rem;box-sizing:border-box;resize:vertical;"></textarea>
    </div>

    <div style="display:flex;gap:12px;margin-top:28px;">
      <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Patient</button>
      <a href="/patients" class="btn btn-outline" style="text-decoration:none;"><i class="fas fa-times"></i> Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
