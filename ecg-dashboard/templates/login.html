<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CardioAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 60%,#1d4ed8 100%);
         font-family:'Segoe UI',sans-serif;}
    .card{background:#fff;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
          width:100%;max-width:420px;padding:48px 40px;}
    .logo{width:72px;height:72px;background:linear-gradient(135deg,#2563eb,#1d4ed8);
          border-radius:18px;display:flex;align-items:center;justify-content:center;
          margin:0 auto 20px;font-size:2rem;color:#fff;}
    h1{text-align:center;font-size:1.7rem;color:#1e293b;margin-bottom:6px;}
    .sub{text-align:center;color:#64748b;font-size:.9rem;margin-bottom:32px;}
    .field{margin-bottom:20px;}
    label{display:block;font-size:.85rem;font-weight:600;color:#475569;margin-bottom:7px;}
    .inp-wrap{position:relative;}
    .inp-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;}
    input{width:100%;padding:12px 14px 12px 42px;border:2px solid #e2e8f0;border-radius:9px;
          font-size:.95rem;transition:border .2s;}
    input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#2563eb,#1d4ed8);
         color:#fff;border:none;border-radius:9px;font-size:1rem;font-weight:600;
         cursor:pointer;transition:transform .15s,box-shadow .15s;margin-top:6px;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,.35);}
    .link{text-align:center;margin-top:22px;font-size:.9rem;color:#64748b;}
    .link a{color:#2563eb;font-weight:600;text-decoration:none;}
    .link a:hover{text-decoration:underline;}
    .alert{padding:11px 15px;border-radius:8px;margin-bottom:18px;font-size:.88rem;}
    .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;}
    .ok {background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><i class="fas fa-heartbeat"></i></div>
  <h1>Welcome Back</h1>
  <p class="sub">Sign in to your CardioAI doctor account</p>

  {% if error %}<div class="alert err"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}
  {% if request.args.get('success') %}<div class="alert ok"><i class="fas fa-check-circle"></i> Account created — please sign in.</div>{% endif %}

  <form method="POST">
    <div class="field">
      <label>Username</label>
      <div class="inp-wrap">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="inp-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
    </div>
    <button class="btn" type="submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </form>

  <p class="link">No account? <a href="/signup">Sign up here</a></p>
</div>
</body>
</html>
